name: Dibs
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Dibs.xcconfig
  Release: Config/Dibs.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Dibs:
    type: application
    platform: iOS
    sources:
      - path: Dibs
    info:
      path: Dibs/Info.plist
      properties:
        DIBS_SERVER_URL: $(DIBS_SERVER_URL)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [dibs]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DIBS_BUNDLE_ID)
        PRODUCT_NAME: Dibs
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dibs
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Dibs streams your cart to your housemates and reads your receipt.
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
  DibsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DibsTests
    dependencies:
      - target: Dibs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DIBS_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  Dibs:
    build:
      targets:
        Dibs: all
        DibsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DibsTests
    archive:
      config: Release
