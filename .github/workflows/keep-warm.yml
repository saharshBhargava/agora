name: keep-warm

# Render's free plan sleeps after 15 idle minutes and takes ~1 minute to wake. This pings /readyz (which also
# touches the database) every 10 minutes so the demo server stays awake. GitHub may delay scheduled runs, so
# for the demo itself also use an uptime monitor or open /healthz a few minutes beforehand.
# Set the repository variable AGORA_API_URL (Settings > Secrets and variables > Actions > Variables), e.g.
# https://agora-api.onrender.com. Without it, this workflow does nothing.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.AGORA_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 "$URL/readyz"
        env:
          URL: ${{ vars.AGORA_API_URL }}
