name: iOS

# PR-only: macOS simulator runs take ~10–14 minutes. Re-running the same suite on every
# push to main doubled post-merge wait without catching merge-only failures that branch
# protection + a green PR check would already require. Backend still re-runs on main and
# hands off to deploy.yml.
on:
  pull_request:
    paths: ["Agora/**", "AgoraTests/**", "Agora.xcodeproj/**", "Config/**", "Fixtures/**", "assets/**", "scripts/generate-project.rb", ".github/workflows/ios.yml"]

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Choose available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Build and test authentication, provider boundaries and the Dibs tab
        run: |
          set -o pipefail
          # Xcode 16.4's iOS 18.5 simulator misses the Swift WebKit overlay for older deployment targets.
          # Apple workaround: https://developer.apple.com/forums/thread/785964
          # This CI override does not change the app's checked-in iOS 17 deployment target.
          xcodebuild test -project Agora.xcodeproj -scheme Agora \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=18.4 \
            -only-testing:AgoraTests/DemoAccessTests \
            -only-testing:AgoraTests/CalendarAuthTests \
            -only-testing:AgoraTests/CalendarToolTests \
            -only-testing:AgoraTests/CalendarAgentTests \
            -only-testing:AgoraTests/BrandInterfaceTests \
            -only-testing:AgoraTests/CaptureTests \
            -only-testing:AgoraTests/InventoryTests \
            -only-testing:AgoraTests/ShoppingTests \
            -only-testing:AgoraTests/ItemImageTests \
            -only-testing:AgoraTests/WatchTests \
            -only-testing:AgoraTests/WatchBrowserTests \
            -only-testing:AgoraTests/TripPlannerTests \
            -only-testing:AgoraTests/TripStoreTests \
            -only-testing:AgoraTests/TripTests \
            -only-testing:AgoraTests/AgoraClientTests \
            -only-testing:AgoraTests/DibsRootTests \
            -only-testing:AgoraTests/DibsNextRunTests \
            -only-testing:AgoraTests/DibsNextRunForecastTests \
            -only-testing:AgoraTests/DibsHouseholdRouteTests \
            -only-testing:AgoraTests/DibsAPITests \
            -only-testing:AgoraTests/DibsWishPicksAPITests \
            -only-testing:AgoraTests/DibsAppModelTests \
            -only-testing:AgoraTests/DibsJoinLinkTests \
            -only-testing:AgoraTests/DibsHomeRoutingTests \
            -only-testing:AgoraTests/DibsRunTextTests \
            -only-testing:AgoraTests/DibsModelTests \
            -only-testing:AgoraTests/DibsQuantityTests \
            -only-testing:AgoraTests/DibsClaimLogicTests \
            -only-testing:AgoraTests/DibsShopperLogicTests \
            -only-testing:AgoraTests/DibsSettleLogicTests \
            -only-testing:AgoraTests/DibsWishLogicTests \
            -only-testing:AgoraTests/DibsRunStoreTests \
            -only-testing:AgoraTests/DibsPriceWorkerTests \
            -only-testing:AgoraTests/DibsCartWatcherTests \
            -only-testing:AgoraTests/DibsTapGateTests \
            -only-testing:AgoraTests/DibsAddFailureClassTests \
            -only-testing:AgoraTests/DibsFrameEncoderTests \
            -only-testing:AgoraTests/DibsScanGeometryTests > build-test.log 2>&1 || { tail -n 160 build-test.log; exit 1; }
      - name: Capture onboarding screen
        run: |
          # Xcode may shut down the selected device after tests or run tests in a clone.
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" build/Build/Products/Debug-iphonesimulator/Agora.app
          xcrun simctl launch "$SIMULATOR_ID" dev.agora.browserchat
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot build/onboarding.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          path: |
            build/TestResults.xcresult
            build/onboarding.png
            build-test.log
