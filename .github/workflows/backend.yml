name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "render.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "render.yaml", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same image family as Tiger Cloud, plus plain Postgres to prove the Timescale layer is optional.
        db: ["timescale/timescaledb-ha:pg17", "postgres:17"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora-ci
          POSTGRES_DB: agora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agora" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          AGORA_TEST_DATABASE_URL: postgresql://agora:agora-ci@localhost:5432/agora

  image:
    # The deploy artifact: make sure it builds and the app imports inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agora-api backend
      - run: docker run --rm agora-api python -c "import app.main, app.worker, app.seed; print('ok')"
