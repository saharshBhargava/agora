name: backend

# Runs on every PR and every push to main that touches the backend. On main, a green run hands off to
# .github/workflows/deploy.yml, which releases that commit to production. See docs/deployment.md.

on:
  push:
    branches: [main]
    paths: ["backend/**", "render.yaml", ".github/workflows/backend.yml", ".github/scripts/**"]
  pull_request:
    paths: ["backend/**", "render.yaml", ".github/workflows/backend.yml", ".github/scripts/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same image family as Tiger Cloud, plus plain Postgres to prove the Timescale layer is optional.
        db: ["timescale/timescaledb-ha:pg17", "postgres:17"]
    services:
      db:
        image: ${{ matrix.db }}
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora-ci
          POSTGRES_DB: agora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agora" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
        env:
          AGORA_TEST_DATABASE_URL: postgresql://agora:agora-ci@localhost:5432/agora

  image:
    # Build using the Blueprint paths, so CI catches Render root-directory mistakes too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --no-project --with 'pyyaml>=6,<7' python .github/scripts/build_render_image.py
      - run: docker run --rm agora-api python -c "import app.main, app.worker, app.seed; print('ok')"

  release-rehearsal:
    # Rehearses on a throwaway database exactly what a production release does: the previous release's
    # schema and data get this branch's migrations applied on boot. Then it checks that BOTH the new code
    # and the previous release (what a rollback would bring back) serve that upgraded database.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora-ci
          POSTGRES_DB: agora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agora" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      AGORA_DATABASE_URL: postgresql://agora:agora-ci@localhost:5432/agora
      AGORA_ENV: dev
      AGORA_AUTH_MODE: dev
      AGORA_RUN_WORKER_IN_PROCESS: "false"
      AGORA_SMOKE_DEV_LOGIN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migration guard (immutable, numbered, backward compatible)
        run: python .github/scripts/check_migrations.py "origin/${{ github.base_ref }}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: previous
      - uses: astral-sh/setup-uv@v5
      - name: Previous release creates and seeds the database (production today)
        working-directory: previous/backend
        run: uv sync --frozen && uv run python -m app.seed
      - name: This branch upgrades that database on boot (what a deploy does)
        working-directory: backend
        run: uv sync --frozen && uv run python -m app.seed && uv run python -m app.seed
      - name: This branch serves the upgraded database
        working-directory: backend
        run: |
          uv run uvicorn app.main:create_app --factory --port 8001 > "$RUNNER_TEMP/new.log" 2>&1 &
          python ../.github/scripts/render_deploy.py smoke --base-url http://127.0.0.1:8001
      - name: The previous release still works on the upgraded schema (rollback is safe)
        working-directory: previous/backend
        run: |
          uv run uvicorn app.main:create_app --factory --port 8002 > "$RUNNER_TEMP/old.log" 2>&1 &
          python ../../.github/scripts/render_deploy.py smoke --base-url http://127.0.0.1:8002
      - name: Server logs
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/new.log" "$RUNNER_TEMP/old.log" 2>/dev/null || true
      - name: Stop servers
        # They hold uv's cache open; setup-uv's post-job cache cleanup fails while they run.
        if: always()
        run: pkill -f "uvicorn app.main:create_app" || true
