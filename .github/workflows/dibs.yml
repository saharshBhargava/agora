name: dibs

# Dibs server/ and web/ (separate from Agora's backend); this workflow never deploys anything.
# Server + web run on PRs and on main (a few minutes on Linux). The Dibs iOS code is the Agora app's
# Dibs tab (Agora/Dibs/), so its simulator tests run in ios.yml with the rest of AgoraTests.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/dev.sh"
      - "scripts/demo-server.sh"
      - "scripts/smoke.sh"
      - "Dockerfile"
      - ".github/workflows/dibs.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/dev.sh"
      - "scripts/demo-server.sh"
      - "scripts/smoke.sh"
      - "Dockerfile"
      - ".github/workflows/dibs.yml"

permissions:
  contents: read

jobs:
  server-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0 # same as the Dockerfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm -C server exec tsc --noEmit
          pnpm -C web exec tsc --noEmit
      - name: Tests
        run: pnpm -r test
      - name: Smoke (builds web + server, starts on a free port with stubs)
        run: scripts/smoke.sh
